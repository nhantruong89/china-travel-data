# Giá vé theo quãng đường, áp dụng từ 01/12/2026 (không gồm tàu đệm từ, đường sắt Kim Sơn, tuyến sân bay):
# 3 tệ cho 0–4 km; rồi +1 tệ sau mỗi 4, 4, 4, 7, 7, 10, 10 km; trên 50 km cứ 15 km +1 tệ.
